name: docker, ci/cd, ec2, hub

on:
  push:
    branches:
      - dev
jobs:
  docker-cicd:
    runs-on: ubuntu-latest
    steps:
      # 소스코드 체크아웃
      - name: 소스코드/체크아웃
        uses: actions/checkout@v4

      # JDK 17 설치
      - name: jdk 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      # 필요시 현재까지 환경 수시 확인 가능
      - name: 현재 상황 체크
        run: |
          pwd
          ls
      # 환경변수 동적 세팅X(여기서는 제외)
      # 빌드, 단위 테스트 -> 편의상 개발자 PC에서 선행수행(생략)
      # 도커 관련 액션 -> 도커 작업을 위한 환경
      - name: 도커 작업을 진행하기 위한 액션 적용
        uses: docker/setup-buildx-action@v3

      # 도커 허브 > 프로필 -? ... 엑세스 토큰 발급
      # 토큰 발급 : 프ㅡ로필 > account settings -> security Personal access token
      # generate New access token 버튼 클릭 -> 적당한이름|만료기간|권한
      # 도커 허브 로그인 -> 계정 정보 -> 시크릿 변수
      - name: 도커 허브 로그인
        run: echo "${{ secrets.HUB_DOCKER_TOKEN }}" | docker login -u "${{ secrets.HUB_DOCKER_NAME }}" --password-stdin

      # 백엔드 이미지 생성 -> 허브(레포지토리) 푸시
      - name: 백엔드 이미지 생성 -> 허브(레포지토리) 푸시
        run : |
          docker build -t kangbinkim/demo_backend ./backend
          docker push kangbinkim/demo_backend

      # 프론트 이미지 생성 -> 허브(레포지토리) 푸시
      - name: 프론트엔드 이미지 생성 -> 허브(레포지토리) 푸시
        run: |
          docker build -t kangbinkim/demo_frontend ./frontend
          docker push kangbinkim/demo_frontend

      # EC2 서버로 필요 파일 업로드(YML, nginx/*.conf)
      # EC2 생성 -> 탄력적 IP 연결 -> 활성화 이후
      # EC2 접속
      # docker-compose.yml ./nginx/default.conf 업로드
      # 타켓 : /home/ubuntu

      # 시스템 패키지 업데이트
      # sudo apt-get update
      # 필요한 패키지 설치
      # sudo apt-get install apt-transport-https ca-certificates curl gnupg-agent software-properties-common -y
      # Docker의 공식 GPG키를 추가
      # curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
      # Docker의 공식 apt 저장소를 추가
      # sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
      # 시스템 패키지 업데이트
      # sudo apt-get update
      # Docker 설치
      # sudo apt-get install docker-ce docker-ce-cli containerd.io -y

      - name: EC2 서버로 필요 파일 업로드
        uses: appleboy/scp-action@v0.1.7
        # 업로드 대상이 n개이면 |로 구성파일, 파일... 표현
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USER}}
          key: ${{secrets.EC2_KEY}}
          source:
              docker-compose.yml,
              ./nginx/default.conf
          target: /home/ubuntu




#
#  deploy:
    # 도커 컴포트 진행