name: docker, ci/cd, ec2, hub

on:
  push:
    branches:
      - dev
jobs:
  docker-cicd:
    runs-on: ubuntu-latest
    steps:
      # 소스코드 체크아웃
      - name: 소스코드/체크아웃
        uses: actions/checkout@v4

      # JDK 17 설치
      - name: jdk 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      # 필요시 현재까지 환경 수시 확인 가능
      - name: 현재 상황 체크
        run: |
          pwd
          ls
      # 환경변수 동적 세팅X(여기서는 제외)
      # 빌드, 단위 테스트 -> 편의상 개발자 PC에서 선행수행(생략)
      # 도커 관련 액션 -> 도커 작업을 위한 환경
      - name: 도커 작업을 진행하기 위한 액션 적용
        uses: docker/setup-buildx-action@v3

      # 도커 허브 > 프로필 -? ... 엑세스 토큰 발급
      # 토큰 발급 : 프ㅡ로필 > account settings -> security Personal access token
      # generate New access token 버튼 클릭 -> 적당한이름|만료기간|권한
      # 도커 허브 로그인 -> 계정 정보 -> 시크릿 변수
      - name: 도커 허브 로그인
        run: echo "${{ secrets.HUB_DOCKER_TOKEN }}" | docker login -u "${{ secrets.HUB_DOCKER_NAME }}" --password-stdin

      # 백엔드 이미지 생성 -> 허브(레포지토리) 푸시
      - name: 백엔드 이미지 생성 -> 허브(레포지토리) 푸시
        run : |
          docker build -t kangbinkim/demo_backend ./backend
          docker push kangbinkim/demo_backend

      # 프론트 이미지 생성 -> 허브(레포지토리) 푸시
      - name: 프론트엔드 이미지 생성 -> 허브(레포지토리) 푸시
        run: |
          docker build -t kangbinkim/demo_frontend ./frontend
          docker push kangbinkim/demo_frontend

      # EC2 서버로 필요 파일 업로드(YML, nginx/*.conf)


#
#  deploy:
    # 도커 컴포트 진행